<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTC Command Centre</title>
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="TTC Command Centre — a calm operations dashboard for content, SEO, publishing, and daily priorities."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="illustrations.css" />
  </head>
  <body>
    <div id="storage-banner" class="storage-banner" hidden></div>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-wrap">
          <div class="brand-mark">TTC</div>
          <div>
            <div class="brand-name">Command Centre</div>
            <div class="brand-subtitle" id="brand-subtitle">Business ops</div>
          </div>
        </div>

        <div class="workspace-switch" id="workspace-switch" role="tablist" aria-label="Workspace"></div>

        <nav id="nav" aria-label="Main navigation"></nav>

        <div class="sidebar-section">
          <div class="section-label" id="quick-links-label">Quick links</div>
          <div id="quick-links"></div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <div class="eyebrow" id="page-eyebrow">Command overview</div>
            <div class="page-title-wrap">
              <h1 id="page-title">Today</h1>
              <span id="page-title-art" class="illustration illustration--compact illustration--title" aria-hidden="true"></span>
            </div>
          </div>
          <div class="topbar-actions" id="topbar-actions">
            <button class="icon-button" id="theme-toggle" type="button" title="Switch to dark theme" aria-label="Switch to dark theme">
              <span class="theme-icon theme-icon-moon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5 6.8 6.8 0 0 0 8 5a8 8 0 1 0 11 9.5Z"/></svg>
              </span>
              <span class="theme-icon theme-icon-sun" aria-hidden="true" hidden>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M17.2 6.8l1.6-1.6M5.2 18.8l1.6-1.6"/></svg>
              </span>
            </button>
            <button class="secondary-button" id="customise-btn" type="button">Customise</button>
            <button class="secondary-button" id="plan-day" type="button">Planner</button>
            <button class="primary-button" id="add-appointment" type="button">Add appointment</button>
          </div>
        </header>

        <div id="page-content"></div>
      </main>
    </div>

    <div id="modal-root" class="modal-root" hidden></div>

    <script src="data.js"></script>
    <script src="personal.js"></script>
    <script src="illustrations.js"></script>
    <script src="liturgy.js"></script>
    <script src="app.js"></script>
  </body>
</html>
