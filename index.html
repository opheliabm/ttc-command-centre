<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTC Command Centre</title>
    <meta
      name="description"
      content="TTC Command Centre — separate Business ops and Personal tracker workspaces."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-workspace="business">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-wrap">
          <div class="brand-mark">TTC</div>
          <div>
            <div class="brand-name">Command Centre</div>
            <div class="brand-subtitle" id="brand-subtitle">Business ops</div>
          </div>
        </div>

        <div class="workspace-switch" id="workspace-switch" role="tablist" aria-label="Workspace"></div>

        <nav id="nav" aria-label="Main navigation"></nav>

        <div class="sidebar-section">
          <div class="section-label" id="quick-links-label">Quick links</div>
          <div id="quick-links"></div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <div class="eyebrow" id="page-eyebrow">Daily operations</div>
            <h1 id="page-title">Today</h1>
          </div>
          <div class="topbar-actions" id="topbar-actions"></div>
        </header>

        <div id="page-content"></div>
      </main>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
